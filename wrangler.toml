name = "gearswipe"
type = "service"
main = "worker/index.ts"
compatibility_date = "2025-08-08"
compatibility_flags = ["nodejs_compat"]

# Site creator D1 database (optional, for site-builder features)
# [[d1_databases]]
# binding = "DB"
# database_name = "site-creator-d1"
# database_id = "00000000-0000-4000-8000-000000000000"

# Site creator R2 bucket (optional, for asset storage)
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "site-creator-r2"

# Cloudflare Analytics Engine for monitoring
[analytics]
enabled = true

# Email routing handler for quote, contact, subscribe forms
[env.production]
name = "gearswipe"
routes = [
  { pattern = "gearswipe.com", zone_name = "gearswipe.com" },
  { pattern = "www.gearswipe.com", zone_name = "gearswipe.com" }
]

[[env.production.routes]]
pattern = "gearswipe.com/api/*"
zone_name = "gearswipe.com"
custom_domain = false

[env.production.env]
ENVIRONMENT = "production"

[env.staging]
name = "gearswipe-staging"
routes = [
  { pattern = "staging.gearswipe.com", zone_name = "gearswipe.com" }
]

[env.staging.env]
ENVIRONMENT = "staging"
