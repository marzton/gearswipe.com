name = "gearswipe"
main = "worker/index.ts"

compatibility_date = "2025-08-08"

# enable_nodejs_process_v2 is the default from compatibility_date 2025-09-15
# onward; this Worker is pinned 38 days earlier, so it otherwise gets the old
# minimal `process` (nextTick/env/exit/getBuiltinModule/platform/features only).
# The SSR bundle opens with an import.meta.url polyfill that falls back to
# process.cwd() -- import.meta.url is not a file: URL under workerd -- so the
# minimal process made every server-rendered route throw
# "TypeError: e.cwd is not a function" at module scope, which reached the
# client as Cloudflare error 1101.
#
# Setting the flag alone fixes that without pulling in a year of unrelated
# compatibility changes. Drop it if compatibility_date is ever moved past
# 2025-09-15, where it becomes redundant.
compatibility_flags = ["nodejs_compat", "enable_nodejs_process_v2"]

# Canonical production catalog/job store. The live Worker currently lacks this
# binding even though `db/index.ts` fails closed when DB is unavailable.
[[d1_databases]]
binding = "DB"
database_name = "gearswipe"
database_id = "f6a19265-b859-4573-8815-5e1907a519e3"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ASSETS_R2"
bucket_name = "gs-assets"

# ⚠️  ALL OTHER CONFIGURATION IS IN THE CLOUDFLARE DASHBOARD
#
# Do NOT add routes or environment variables here. The D1 and R2 bindings above
# are version-controlled because the application depends on these exact named
# resources. Do not also configure `DB` or `ASSETS_R2` in the dashboard for this
# Worker — `wrangler deploy` owns these bindings from this file.
# Workflow declarations are supplied by `vite.config.ts` because the Vinext
# Cloudflare plugin generates the deploy config and otherwise drops them.
#
# Everything else is configured and managed entirely via:
#   Cloudflare Dashboard → Workers & Pages → gearswipe
#
# For complete setup instructions, see DEPLOYMENT.md § Dashboard Configuration
