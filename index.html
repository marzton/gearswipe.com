<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GearSwipe</title>
<meta name="description" content="GearSwipe">
<meta name="robots" content="noindex">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #5c636e;
    --line: #e4e7ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --fg: #f2f4f7; --muted: #9aa3af; --line: #262a31; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 2rem;
  }
  main { max-width: 32rem; text-align: center; }
  h1 {
    margin: 0 0 .5rem;
    font-size: clamp(2rem, 6vw, 3rem);
    letter-spacing: -0.02em;
    font-weight: 650;
  }
  p { margin: 0; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2rem auto; width: 3rem; }
</style>
</head>
<body>
  <main>
    <h1>GearSwipe</h1>
    <hr>
    <p>This site is being set up.</p>
  </main>
</body>
</html>
