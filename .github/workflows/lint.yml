name: Lint & Format

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: ./.github/actions/checkout-repo

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint 2>&1 || EXIT_CODE=$?
        id: lint

      - name: Comment PR with lint results (if failed)
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body '⚠️ ESLint found issues. Run `npm run lint` locally to fix them.'

      - name: Report lint status
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" = "failure" ]; then
            echo "❌ Lint check failed"
            exit 1
          fi
          echo "✅ Lint check passed"

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: ./.github/actions/checkout-repo

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit || true

      - name: Verify no console.logs in production code
        run: |
          if grep -r "console\." app/ lib/ --include="*.ts" --include="*.tsx" \
             --exclude-dir=node_modules 2>/dev/null; then
            echo "⚠️ Warning: Found console.logs in code. Consider removing them."
            exit 0  # Not a hard error, just a warning
          fi
