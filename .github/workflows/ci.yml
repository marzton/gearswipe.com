name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application and Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: ./.github/actions/checkout-repo

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Test production build
        run: npm test

      - name: Validate storefront Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Validate quote API Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.quote-api.toml
