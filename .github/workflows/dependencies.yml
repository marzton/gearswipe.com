name: Dependencies

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    name: Update lockfile and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate || true

      - name: Update lockfile (if outdated)
        run: |
          npm install --package-lock-only
          if git diff --quiet package-lock.json; then
            echo "Lockfile is up to date"
          else
            echo "Lockfile was updated"
          fi

      - name: Verify build still works
        run: npm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5e914681df9dc85aa908c9e1d2e0dd4ac12e25f8 # v6.1.0
        with:
          commit-message: 'chore: update package-lock.json dependencies'
          title: 'chore: update package-lock.json'
          body: |
            ## Automated Dependency Update

            This PR updates the lockfile to ensure dependencies are current and security patches are applied.

            **Changes**:
            - Updated `package-lock.json`
            - Verified production build succeeds
            - Ran npm audit

            **Review checklist**:
            - [ ] Verify no breaking changes in dependencies
            - [ ] Test critical paths in application
            - [ ] Merge when ready
          branch: chore/update-dependencies
          delete-branch: true
          labels: 'chore,dependencies'
