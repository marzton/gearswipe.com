name: Auto-Fix Issues

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    name: Fix linting and formatting issues
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with autofix
        run: |
          npm run lint -- --fix || true
          echo "ESLint autofix completed"

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected, will create PR"
            git diff --stat
          fi

      - name: Create Pull Request with fixes
        if: steps.check-changes.outputs.has-changes == 'true'
        uses: peter-evans/create-pull-request@5e914681df9dc85aa908c9e1d2e0dd4ac12e25f8 # v6.1.0
        with:
          commit-message: |
            chore: fix linting and formatting issues

            - Ran ESLint with --fix flag
            - Auto-corrected formatting issues
            - No functional code changes
          title: 'chore: auto-fix linting issues'
          body: |
            ## Automated Linting Fixes

            This PR automatically fixes linting and formatting issues found in the codebase.

            **What was fixed**:
            - ESLint auto-fixable issues
            - Code formatting inconsistencies

            **No functional changes** — purely style and formatting corrections.

            **Action**: Review and merge when satisfied with changes.
          branch: chore/autofix-linting
          delete-branch: true
          labels: 'chore,automated'

  detect-bugs:
    name: Detect potential bugs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build succeeds
        run: npm run build

      - name: Check for common bug patterns
        run: |
          echo "Scanning for potential bugs..."

          # Check for unhandled promises
          if grep -r "async\|await\|\.then\|\.catch" app/ lib/ --include="*.ts" --include="*.tsx" | \
             grep -v "// " | grep -v "/\* " | grep -v "catch" > /dev/null 2>&1; then
            echo "ℹ️  Found async/await patterns. Verify error handling."
          fi

          # Check for any errors in production code
          if grep -r "throw new Error" app/ lib/ --include="*.ts" --include="*.tsx" | \
             grep -v "// " | grep -v "test" > /dev/null 2>&1; then
            echo "ℹ️  Found explicit error throws. Verify error handling is appropriate."
          fi

          echo "✅ Bug scan complete"

  type-check:
    name: TypeScript type checking
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

      - name: Report type check results
        if: always()
        run: echo "✅ TypeScript type checking complete"
