name: Workflow Sync & Validation

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Thursdays at 3 PM UTC
    - cron: '0 15 * * 4'

permissions:
  contents: read
  actions: read

concurrency:
  group: workflow-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workflows:
    name: Validate workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf "$GITHUB_WORKSPACE"/*
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if ! git -C "$GITHUB_WORKSPACE" fetch --depth 1 origin "$GITHUB_REF"; then
            git -C "$GITHUB_WORKSPACE" fetch --depth 1 origin "$GITHUB_SHA"
          fi
          git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

      - name: Validate workflow files
        run: |
          echo "Validating GitHub Actions workflows..."

          for workflow in .github/workflows/*.yml; do
            echo "Checking: $workflow"
            if ! grep -q "^name:" "$workflow"; then
              echo "❌ Missing 'name:' in $workflow"
              exit 1
            fi
            if ! grep -q "^on:" "$workflow"; then
              echo "❌ Missing 'on:' in $workflow"
              exit 1
            fi
            if ! grep -q "jobs:" "$workflow"; then
              echo "❌ Missing 'jobs:' in $workflow"
              exit 1
            fi
          done

          echo "✅ All workflows have required fields"

  sync-actions:
    name: Check for outdated action versions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf "$GITHUB_WORKSPACE"/*
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if ! git -C "$GITHUB_WORKSPACE" fetch --depth 1 origin "$GITHUB_REF"; then
            git -C "$GITHUB_WORKSPACE" fetch --depth 1 origin "$GITHUB_SHA"
          fi
          git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

      - name: Find outdated action versions
        run: |
          echo "Checking for outdated GitHub Actions..."

          # Find all action references with pinned versions
          grep -r "uses: .*@" .github/workflows/ | grep -v "# " || true

          echo ""
          echo "ℹ️  To update actions, use: npx github-action-updater"
          echo "Or manually update with: actions/... with: ... @ v[latest]"

  check-permissions:
    name: Validate workflow permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf "$GITHUB_WORKSPACE"/*
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if ! git -C "$GITHUB_WORKSPACE" fetch --depth 1 origin "$GITHUB_REF"; then
            git -C "$GITHUB_WORKSPACE" fetch --depth 1 origin "$GITHUB_SHA"
          fi
          git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

      - name: Verify minimal permissions
        run: |
          echo "Checking workflow permissions principle..."

          # Check for overly permissive permissions
          if grep -r "permissions:" .github/workflows/ | grep -q "id-token: write"; then
            echo "⚠️  id-token: write detected. Ensure this is necessary."
          fi

          if grep -r "permissions:" .github/workflows/ | grep -q "pull-requests: admin"; then
            echo "⚠️  pull-requests: admin detected. Consider using 'write' instead."
          fi

          echo "✅ Permissions check complete"

  test-workflows:
    name: Test workflow configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf "$GITHUB_WORKSPACE"/*
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if ! git -C "$GITHUB_WORKSPACE" fetch --depth 1 origin "$GITHUB_REF"; then
            git -C "$GITHUB_WORKSPACE" fetch --depth 1 origin "$GITHUB_SHA"
          fi
          git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

      - name: Verify workflow triggers
        run: |
          echo "Verifying workflow triggers are configured..."

          # CI should run on PR and push to main
          if ! grep -A 5 "^on:" .github/workflows/ci.yml | grep -q "pull_request"; then
            echo "⚠️  CI workflow should trigger on pull_request"
          fi

          if ! grep -A 10 "^on:" .github/workflows/ci.yml | grep -q "push"; then
            echo "⚠️  CI workflow should trigger on push"
          fi

          echo "✅ Workflow triggers configured"

      - name: Check for secrets in workflows
        run: |
          echo "Scanning for hardcoded secrets..."

          if grep -r 'secrets\.' .github/workflows/ | grep -q '\$'; then
            echo "ℹ️  Secrets are properly referenced via GitHub Actions expressions"
          fi

          # Check for common secret patterns
          if grep -rE "password|token|key|secret" .github/workflows/ | \
             grep -v 'secrets\.' | \
             grep -v "# " | \
             grep -v "GITHUB_TOKEN"; then
            echo "⚠️  Potential hardcoded credentials detected. Review manually."
          else
            echo "✅ No obvious hardcoded secrets found"
          fi
